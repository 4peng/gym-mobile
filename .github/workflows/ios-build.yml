name: Build iOS IPA (Sideloading)
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Expo Prebuild
        run: npx expo prebuild --platform ios

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build App with Xcode
        run: |
          echo "--- iOS Directory ---"
          ls -la
          ls -la ios || true
          find ios -maxdepth 2 \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) -print || true

          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "Error: Expected an Xcode workspace after pod install, but none was found."
            exit 1
          fi

          CONTAINER_FLAG="-workspace"
          CONTAINER_PATH="$WORKSPACE"

          echo "--- Available Schemes ---"
          xcodebuild $CONTAINER_FLAG "$CONTAINER_PATH" -list

          SCHEME=$(xcodebuild $CONTAINER_FLAG "$CONTAINER_PATH" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | sed 's/^[[:space:]]*//' | grep -v "Pods-" | grep -i "gym" | head -n 1)

          if [ -z "$SCHEME" ]; then
            SCHEME=$(xcodebuild $CONTAINER_FLAG "$CONTAINER_PATH" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | sed 's/^[[:space:]]*//' | grep -v "Pods-" | head -n 1)
          fi

          if [ -z "$SCHEME" ]; then
            echo "Error: Could not determine a non-Pods Xcode scheme."
            exit 1
          fi

          echo "Selected Container: $CONTAINER_FLAG $CONTAINER_PATH"
          echo "Final Selected Scheme: $SCHEME"

          xcodebuild archive \
            $CONTAINER_FLAG "$CONTAINER_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/GymMobile.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Find and Copy App
        run: |
          # In an xcarchive, the app is always in the same place
          APP_PATH=$(find build/GymMobile.xcarchive -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app file in archive. Listing archive contents:"
            find build -maxdepth 5
            exit 1
          fi
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r GymMobile.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: GymMobile.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automated build for sideloading.
            Commit: ${{ github.sha }}
          files: GymMobile.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
