name: Build iOS IPA (Sideloading)
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Expo Prebuild
        run: npx expo prebuild --platform ios

      - name: Build App with Xcode
        run: |
          # 1. List everything for debugging
          echo "--- Available Schemes ---"
          xcodebuild -workspace ios/*.xcworkspace -list
          
          # 2. Try to find the main app scheme (usually matches the project name or slug)
          # We look for a scheme that is NOT 'Pods' and contains the project name.
          SCHEME=$(xcodebuild -workspace ios/*.xcworkspace -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | sed 's/^[[:space:]]*//' | grep -v "Pods-" | grep -i "gym" | head -n 1)
          
          # Fallback: just take the first non-Pods scheme if the search fails
          if [ -z "$SCHEME" ]; then
            SCHEME=$(xcodebuild -workspace ios/*.xcworkspace -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | sed 's/^[[:space:]]*//' | grep -v "Pods-" | head -n 1)
          fi
          
          echo "Final Selected Scheme: $SCHEME"
          
          # 3. Use 'archive' which is more robust for creating the .app
          xcodebuild archive \
            -workspace ios/*.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/GymMobile.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Find and Copy App
        run: |
          # In an xcarchive, the app is always in the same place
          APP_PATH=$(find build/GymMobile.xcarchive -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app file in archive. Listing archive contents:"
            find build -maxdepth 5
            exit 1
          fi
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r GymMobile.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: GymMobile.ipa
